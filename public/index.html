<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>¿NO NOS CREES? — Archivo histórico</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Marco negro a pantalla completa. Dentro, el "escenario" está maquetado
       a una resolución fija (config.js) y se escala para encajar. -->
  <div id="marco">
    <div id="escenario">

      <!-- Webcam: SOLO se usa para leer el QR. Nunca se muestra en pantalla
           ni se guarda ninguna imagen. Se mantiene 1px/opacidad 0 para que
           el navegador siga entregando fotogramas al lector de QR. -->
      <video id="camara" playsinline muted autoplay></video>

      <!-- ================= ESTADO 1 · ESPERA =================
           Fondo: imagen "cuestionario fondo" repetida (dos copias apiladas)
           que se desplaza despacio en bucle, desenfocada.
           Primer plano: imagen "cuestionario en primer plano" (la ficha
           amarilla), estática y centrada.
           Ambas imágenes viven en public/img/ y son sustituibles sin tocar
           el código:  espera-fondo.jpg  /  espera-primer-plano.png          -->
      <section class="pantalla" id="p-espera">
        <div class="espera-fondo" aria-hidden="true">
          <div class="espera-fondo-cinta">
            <img src="img/espera-fondo.jpg" alt="">
            <img src="img/espera-fondo.jpg" alt="">
          </div>
        </div>

        <img class="espera-primer-plano"
             src="img/espera-primer-plano.png"
             alt="Esto con Franco sí pasaba. Escanea el código QR de las fotografías en la cámara de la parte inferior.">

        <p class="espera-error" hidden></p>
        <p id="aviso-camara" hidden></p>
      </section>

      <!-- ================= ESTADO 2 · EXPEDIENTE ==================
           Secuencia por QR (data/expedientes.json -> "secuencia"):
           vídeos (duran lo suyo) e imágenes (MS_IMAGEN, config.js), todo
           a pantalla completa y sin texto encima; se encadenan solas y,
           al terminar el último elemento, se vuelve a ESPERA.            -->
      <section class="pantalla" id="p-expediente">
        <video id="video-secuencia" playsinline></video>
        <img id="img-secuencia" alt="" hidden>
        <!-- Barra de progreso del elemento en curso: abajo del todo, blanca,
             se completa en negro según el tiempo que queda. -->
        <div class="barra-progreso" aria-hidden="true">
          <div class="barra-progreso-relleno"></div>
        </div>
      </section>

      <!-- ================= Modo desarrollo (?dev=1) ================= -->
      <div id="dev" hidden>
        <span class="dev-tit">MODO PRUEBA</span>
        <button type="button" data-exp="EXP-001">EXP-001</button>
        <button type="button" data-exp="EXP-002">EXP-002</button>
        <button type="button" data-exp="EXP-003">EXP-003</button>
        <button type="button" data-accion="reiniciar">Reiniciar</button>
      </div>

    </div>
  </div>

  <!-- Lienzo oculto donde se vuelca cada fotograma de la webcam para leer el QR -->
  <canvas id="lienzo-qr" hidden></canvas>

  <script src="config.js"></script>
  <script src="lib/jsQR.js"></script>
  <script src="app.js"></script>
</body>
</html>
